<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>传奇一串四！锐评BLG全员蜕变战胜GENG！拿下超级含金量冠军！</title>
<style>
  :root{--header:64px;--rail:320px;--pink:#fb6699;--muted:#67747e;--line:#e8ebef}
  *{box-sizing:border-box}
  body{margin:0;color:#18232d;background:#fff;font:14px/1.5 system-ui,"PingFang SC",sans-serif}
  a{color:inherit;text-decoration:none}
  button,input{font:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid #a52456;outline-offset:3px}
  header{height:var(--header);display:grid;grid-template-columns:1fr minmax(0,525px) 1fr;align-items:center;gap:16px;padding:0 clamp(12px,2vw,30px);border-bottom:1px solid var(--line)}
  .logo{display:block;width:84px;height:auto;filter:brightness(0) saturate(100%) invert(55%) sepia(72%) saturate(1488%) hue-rotate(303deg)}
  form input{width:100%;height:38px;border:1px solid #b5bec8;border-radius:10px;padding:0 12px;background:#fff}
  .top-actions{display:flex;align-items:center;justify-self:end;gap:4px}
  .top-actions .icon-button{display:grid;place-items:center;width:28px;height:28px;padding:4px;border:0;border-radius:10px;color:#98a3ad;background:transparent}
  .top-actions .icon-button:hover{background:#f4f6f8}
  .top-actions svg{display:block;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .top-actions .avatar{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:#ffe0ea;color:#d34e79;font-size:12px;font-weight:800}
  main{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);align-items:start}
  .watch-main{min-width:0}
  .player-shell{
    --player-height:max(0px,calc(100dvh - var(--header) - 218px));
    height:var(--player-height);
  }
  .stage{height:100%;display:grid;place-items:center;container-type:size;background:#000}
  .drag-handle{display:none}
  .stage.floating{
    position:fixed;z-index:10;left:var(--mini-x,12px);top:var(--mini-y,clamp(28px,calc(var(--header) + 40px),calc(100dvh - min(216px, (100dvh - 52px)))));
    width:min(384px,calc(100vw - 24px),calc((100dvh - 52px) * 16 / 9));
    height:auto;aspect-ratio:16/9;border-radius:0 0 8px 8px;
  }
  .stage.floating .drag-handle{
    display:block;position:absolute;bottom:100%;left:0;width:100%;height:28px;
    border:0;border-radius:8px 8px 0 0;background:#242424;color:#fff;
    cursor:grab;touch-action:none;user-select:none;
  }
  .drag-handle:active{cursor:grabbing}
  iframe{display:block;width:min(100cqw,calc(100cqh * 16 / 9));height:auto;aspect-ratio:16/9;border:0;background:#000}
  .comments{min-height:218px;padding:20px clamp(16px,3vw,48px) 32px}
  h1,h2,p{margin:0}
  h2{font-size:18px}
  h2 small{margin-left:8px;font-size:13px;color:var(--muted);font-weight:400}
  .comment{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .bubble{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#ffe8f1;color:#a52456;font-weight:700}
  .comment p{margin:3px 0}
  small,.meta{color:var(--muted)}
  aside{min-width:0;border-left:1px solid var(--line);padding:22px 18px}
  .author{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .author .bubble{width:52px;height:52px;font-size:20px}
  .button{display:inline-block;border:0;border-radius:8px;padding:6px 13px;margin-right:4px;background:#f1f3f5}
  .button[aria-pressed=true]{color:#8c1746;background:#ffe1ed}
  .button.follow{color:#fff;background:#FB6699}
  h1{font-size:clamp(18px,1.4vw,23px);line-height:1.4}
  .meta{font-size:12px;margin:10px 0 16px}
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
  .actions button{display:grid;justify-items:center;gap:5px;background:none;border:0;color:inherit}
  .actions span{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#f3f4f6;font-size:20px}
  .actions button[aria-pressed=true] span{background:#ffe1ed;color:#a52456}
  .feedback{min-height:20px;font-size:12px;color:var(--muted)}
  .recommendations{border-top:1px solid var(--line);margin-top:10px;padding-top:14px}
  .related{display:grid;grid-template-columns:46% minmax(0,1fr);gap:10px;margin-top:12px}
  .related img{width:100%;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:#eef0f2}
  .related strong{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:13px;line-height:1.35}
  .related small{display:block;margin-top:4px;font-size:11px}
  a:hover{color:#a52456}
  @media(min-width:680px){
    .stage.floating{max-width:calc(100vw - var(--rail) - 40px)}
    main{height:calc(100vh - var(--header));height:calc(100dvh - var(--header))}
    .watch-main,main > aside{height:100%;min-height:0;overflow-y:auto;overscroll-behavior-y:contain}
  }
  @media(min-width:1440px){:root{--rail:500px}aside{padding:24px}}
  @media(max-width:679px){main{grid-template-columns:minmax(0,1fr)} aside{border-left:0;border-top:1px solid var(--line)} header{grid-template-columns:auto minmax(0,1fr) auto;gap:10px}.logo{width:66px}.player-shell{--player-height:min(56.25vw,max(0px,calc(100dvh - var(--header) - 218px)))}}
  .layout-select{font:inherit;font-size:12px;width:66px;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;color:inherit}
  .video-details{display:flex;flex-direction:column}
  .video-summary,.summary-content,.metadata,.interaction-row{display:contents}
  .comments-right .summary-content{display:block}
  .video-details .author{order:-1}
  .comments-right .interaction-row .author{order:0}
  .comments-right{--watch-width:calc(100vw - var(--rail) - 16px)}
  .comments-right .player-shell{--player-height:min(calc(var(--watch-width) * .5625),max(0px,calc(100dvh - var(--header) - 140px)))}
  .comments-right .video-details{container-type:inline-size;padding:0 clamp(12px,2vw,24px) 24px}
  .comments-right .watch-main{
    --sticky-top:0px;
    --summary-gap:clamp(12px,2vw,24px);
    --summary-video-width:min(240px,calc(var(--watch-width) * .28),calc((var(--summary-height) - 24px) * 16 / 9));
  }
  .comments-right .video-summary{
    display:block;position:sticky;top:var(--sticky-top);z-index:2;
    padding-block:18px 12px;background:#fff;
  }
  .comments-right .watch-main:has(.stage.floating) .video-summary{
    padding-left:calc(var(--summary-video-width) + var(--summary-gap));
    height:var(--summary-height);overflow:auto;
  }
  .comments-right .stage.floating{
    left:var(--summary-gap);top:calc(var(--header) + 12px);
    width:var(--summary-video-width);max-width:none;z-index:3;border-radius:8px;
  }
  .comments-right .stage.floating .drag-handle{display:none}
  @media(max-width:679px){.comments-right .stage.floating{top:12px}}
  .comments-right .metadata{display:flex;align-items:center;gap:18px;overflow-x:auto}
  .comments-right .metadata h1{flex:1;min-width:2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .comments-right .metadata .meta{flex:none;white-space:nowrap}
  .comments-right .meta{margin:0}
  .comments-right .interaction-row{display:flex;align-items:center;justify-content:space-between;gap:12px 18px;overflow-x:auto;margin-top:12px}
  .comments-right .author,.comments-right .actions{flex:none;margin:0}
  .comments-right .actions{grid-template-columns:repeat(4,auto)}
  .comments-right .feedback:empty{display:none}
  .comments-right #related-list,.recommendations-left #related-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px}
  .comments-right .related,.recommendations-left .related{display:flex;flex-direction:column;margin:0}
  .comments-right aside .comments{padding:0}
  .recommendations-left .watch-main > .recommendations{
    container-type:inline-size;border-top:0;margin:0;padding:18px clamp(12px,2vw,24px) 24px;
  }
  .recommendations-left aside .comments{padding:16px 0 0;border-top:1px solid var(--line)}
  @media(min-width:680px){
    .recommendations-left .stage.floating{max-width:calc(var(--rail) - 32px)}
  }
  @container (width < 600px){.comments-right #related-list,.recommendations-left #related-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:679px){.comments-right{--watch-width:100vw}}
  @media(max-width:380px){
    header{padding-inline:8px;gap:6px}
    .logo{width:46px}
    .layout-select{width:56px}
    .top-actions{gap:2px}
    form input{min-width:0;padding-inline:5px}
  }
</style>
</head>
<body>
<header>
  <a href="index.html" aria-label="返回首页"><img class="logo" src="Assets/logo-white.png" alt="bilibili"></a>
  <form action="./" role="search"><input name="q" type="search" aria-label="搜索视频" placeholder="搜索你感兴趣的视频" required></form>
  <div class="top-actions">
    <select class="layout-select" aria-label="播放页布局" title="播放页布局">
      <option value="bottom">评论在下</option>
      <option value="right">评论在右</option>

    <a class="icon-button" href="https://member.bilibili.com/platform/upload/video/frame" target="_blank" rel="noopener" aria-label="投稿（在新标签页打开）" title="投稿">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>

<main>
  <div class="watch-main">

    <section class="comments" aria-labelledby="comments-title">

      <article class="comment"><span class="bubble" aria-hidden="true">橘</span><div><strong>橘子汽水</strong><p>一路看到捧杯，那一刻真的替他们开心。</p><small>3 小时前 · 206 赞</small></div></article>
      <article class="comment"><span class="bubble" aria-hidden="true">野</span><div><strong>野区路过</strong><p>这期把视野布置讲清楚了，回去重看比赛发现好多细节。</p><small>昨天 · 91 赞</small></div></article>

</main>
<script src="Assets/home-feed.js?v=9b64ab93e7"></script>
<script>
  const watchColumn = document.querySelector('.watch-main');
  const playerShell = document.querySelector('.player-shell');
  const stage = playerShell.querySelector('.stage');
  const dragHandle = stage.querySelector('.drag-handle');
  const videoSummary = document.querySelector('.video-summary');
  const summaryContent = videoSummary.querySelector('.summary-content');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let summaryAnimation;
  const singleColumn = matchMedia('(max-width: 679px)');

  function syncMiniPlayer() {
    const visibleTop = singleColumn.matches ? 0 : watchColumn.getBoundingClientRect().top;
    const wasFloating = stage.classList.contains('floating');
    const isFloating = playerShell.getBoundingClientRect().bottom <= visibleTop;
    if (isFloating && !wasFloating && document.body.classList.contains('comments-right')) {
      measureSummaryHeight();
    }
    stage.classList.toggle('floating', isFloating);
    if (wasFloating !== isFloating && document.body.classList.contains('comments-right') && !reducedMotion.matches) {
      summaryAnimation?.cancel();
      summaryAnimation = summaryContent.animate(
        [{opacity: .6, transform: isFloating ? 'translateX(-10px)' : 'translateX(10px)'},
          {opacity: 1, transform: 'translateX(0)'}],
        {duration: 220, easing: 'ease-out'}
      );
    }
    if (isFloating && !wasFloating) positionMiniPlayer();
  }

  function measureSummaryHeight() {
    watchColumn.style.setProperty('--summary-height', videoSummary.getBoundingClientRect().height + 'px');
  }

  let draggedPosition;
  let splitDraggedPosition;
  function positionMiniPlayer() {
    if (document.body.classList.contains('comments-right')) return;
    if (document.body.classList.contains('recommendations-left')) {
      const rightEdge = document.documentElement.clientWidth;
      moveMiniPlayer(splitDraggedPosition?.x ?? rightEdge - stage.offsetWidth - 12,
        splitDraggedPosition?.y ?? window.innerHeight - stage.offsetHeight - 12);
      return;
    }
    const columnRight = watchColumn.getBoundingClientRect().left + watchColumn.clientWidth;
    const x = draggedPosition?.x ?? columnRight - stage.offsetWidth - 12;
    const y = draggedPosition?.y ?? (singleColumn.matches ? 40 : watchColumn.getBoundingClientRect().top + 40);
    moveMiniPlayer(x, y);
  }

  function moveMiniPlayer(x, y) {
    const position = {
      x: Math.max(0, Math.min(x, document.documentElement.clientWidth - stage.offsetWidth)),
      y: Math.max(dragHandle.offsetHeight, Math.min(y, window.innerHeight - stage.offsetHeight))
    };
    stage.style.setProperty('--mini-x', position.x + 'px');
    stage.style.setProperty('--mini-y', position.y + 'px');
    return position;
  }

  let drag;
  let dragged = false;
  dragHandle.addEventListener('pointerdown', event => {
    if (event.button !== 0 || !event.isPrimary) return;
    const bounds = stage.getBoundingClientRect();
    drag = {id: event.pointerId, x: bounds.left - event.clientX, y: bounds.top - event.clientY,
      startX: event.clientX, startY: event.clientY};
    dragged = false;
    dragHandle.setPointerCapture(event.pointerId);
  });
  dragHandle.addEventListener('pointermove', event => {
    if (event.pointerId !== drag?.id) return;
    dragged ||= Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) >= 4;
    if (dragged) {
      const position = moveMiniPlayer(event.clientX + drag.x, event.clientY + drag.y);
      if (document.body.classList.contains('recommendations-left')) splitDraggedPosition = position;
      else draggedPosition = position;
    }
  });
  dragHandle.addEventListener('lostpointercapture', () => { drag = undefined; });
  dragHandle.addEventListener('click', event => {
    if (dragged && event.detail !== 0) return;
    if (singleColumn.matches) window.scrollTo(0, 0);
    else watchColumn.scrollTop = 0;
    syncMiniPlayer();
  });

  watchColumn.addEventListener('scroll', syncMiniPlayer, {passive: true});
  window.addEventListener('scroll', syncMiniPlayer, {passive: true});
  window.addEventListener('resize', () => {
    if (document.body.classList.contains('comments-right')) stage.classList.remove('floating');
    syncMiniPlayer();
    if (stage.classList.contains('floating')) positionMiniPlayer();
  });
  window.addEventListener('pageshow', syncMiniPlayer);
  syncMiniPlayer();

  const layoutSelect = document.querySelector('.layout-select');
  const sidebar = document.querySelector('main > aside');
  const comments = document.querySelector('.comments');
  const details = document.querySelector('.video-details');
  const recommendationSection = document.querySelector('.recommendations');
  const layoutKey = 'video-redesign-watch-layout';

  function applyWatchLayout() {
    const commentsRight = layoutSelect.value === 'right';
    const recommendationsLeft = layoutSelect.value === 'split';
    stage.classList.remove('floating');
    document.body.classList.toggle('comments-right', commentsRight);
    document.body.classList.toggle('recommendations-left', recommendationsLeft);
    if (recommendationsLeft) {
      watchColumn.append(recommendationSection);
      sidebar.append(details, comments);
    } else {
      details.append(recommendationSection);
      watchColumn.append(commentsRight ? details : comments);
      sidebar.append(commentsRight ? comments : details);
    }
    sidebar.setAttribute('aria-label', recommendationsLeft ? '视频信息与评论' :
      commentsRight ? '评论' : '视频信息与推荐');
    syncMiniPlayer();
    if (stage.classList.contains('floating')) positionMiniPlayer();
  }

  try {
    const savedLayout = localStorage.getItem(layoutKey);
    if (savedLayout === 'right' || savedLayout === 'split') layoutSelect.value = savedLayout;
  } catch {}
  applyWatchLayout();

  layoutSelect.addEventListener('change', () => {
    applyWatchLayout();
    try { localStorage.setItem(layoutKey, layoutSelect.value); } catch {}
  });

  const requestedId = new URLSearchParams(location.search).get('v');
  const selectedVideo = [...homeFeed, ...archivedFeed].find(video => videoIdFromCover(video.cover) === requestedId);
  const activeVideoId = selectedVideo ? requestedId : 'BV1J9sF6YEdQ';
  const playerUrl = new URL('https://player.bilibili.com/player.html');
  playerUrl.search = new URLSearchParams({
    bvid: activeVideoId, page: '1', autoplay: '1', muted: '1'
  });
  stage.querySelector('iframe').src = playerUrl.href;

  if (selectedVideo) {
    document.querySelector('.author strong').textContent = selectedVideo.author;
    document.querySelector('.author .bubble').textContent = Array.from(selectedVideo.author)[0];
    document.querySelector('.author a.button').href = 'https://www.bilibili.com/video/' + requestedId + '/';
    document.querySelector('h1').textContent = selectedVideo.title;
    document.title = selectedVideo.title;
    document.querySelector('.meta').textContent = [selectedVideo.views + '播放', selectedVideo.date].join(' · ');

    const exampleComments = ['这段值得回看，第一次看漏了好多细节。', '节奏很舒服，一口气看完了。', '先收藏，晚点再看一遍。'];
    document.querySelectorAll('.comment p').forEach((comment, index) => {
      comment.textContent = exampleComments[index];
    });
  }

  const relatedList = document.querySelector('#related-list');
  const recommendations = homeFeed
    .map(video => ({video, bvid: videoIdFromCover(video.cover)}))
    .filter(({bvid}) => bvid && bvid !== activeVideoId)
    .slice(0, 20);

  for (const {video, bvid} of recommendations) {
    const link = document.createElement('a');
    link.className = 'related';
    link.href = 'watch.html?v=' + bvid;
    const cover = document.createElement('img');
    cover.src = video.cover;
    cover.alt = '';
    cover.loading = 'lazy';
    const info = document.createElement('span');
    const title = document.createElement('strong');
    title.textContent = video.title;
    const meta = document.createElement('small');
    meta.append(video.author, document.createElement('br'), video.views + '播放');
    info.append(title, meta);
    link.append(cover, info);
    relatedList.append(link);
  }

  const commentSection = document.querySelector('.comments');
  const sampleComments = Array.from(commentSection.querySelectorAll('.comment'));
  const extraCopies = 17;
  const commentCopies = document.createDocumentFragment();
  for (let copy = 0; copy < extraCopies; copy++) {
    for (const comment of sampleComments) commentCopies.append(comment.cloneNode(true));
  }
  commentSection.append(commentCopies);
  document.querySelector('#comments-title small').textContent =
    `${sampleComments.length * (extraCopies + 1)} · 示例评论`;

  document.querySelector('#notifyButton').onclick = () => alert('暂时没有新消息');
  document.querySelector('#profileButton').onclick = () => alert('个人中心即将开放');

  const feedback = document.querySelector('.feedback');
  for (const button of document.querySelectorAll('[data-toggle]')) {
    button.addEventListener('click', () => {
      const active = button.getAttribute('aria-pressed') === 'false';
      button.setAttribute('aria-pressed', active);
      if (button.classList.contains('follow')) button.textContent = active ? '已关注' : '关注';
      feedback.textContent = active ? '已更新预览状态' : '';
    });
  }
  document.querySelector('#share').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      feedback.textContent = '已复制播放页链接';
    } catch {
      feedback.textContent = '可在地址栏复制播放页链接';
    }
  });
</script>
</body>
</html>
