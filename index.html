      {title:'周末去看一场演出，顺便捡回一点快乐',author:'阿橘不加糖',category:'娱乐',views:'12.4万',duration:'06:51',date:'2天前',image:5},
      {title:'用一支短片记录二十岁最后一个夏天',author:'野生放映员',category:'生活',views:'42.1万',duration:'09:35',date:'3天前',image:6},
      {title:'离开城市的48小时：山野、日落和风',author:'慢慢去远方',category:'旅行',views:'17.9万',duration:'12:47',date:'3天前',image:7},
      {title:'把旧房间改造成理想的创作角落',author:'空间漫游',category:'生活',views:'8.3万',duration:'07:24',date:'4天前',image:8},
      {title:'一碗热气腾腾的面，是雨天最好的答案',author:'阿有的厨房',category:'美食',views:'33.6万',duration:'10:12',date:'4天前',image:9},
      {title:'这些小设备，悄悄改变了我的工作方式',author:'好奇心电台',category:'科技',views:'7.8万',duration:'13:02',date:'5天前',image:10},
      {title:'朋友相聚时那些完全没计划的快乐',author:'今天也晴朗',category:'鬼畜',views:'29.4万',duration:'05:19',date:'5天前',image:11},
      {title:'想念海的时候，就来看一会儿浪',author:'浪花放送',category:'纪录片',views:'15.1万',duration:'18:08',date:'6天前',image:12}
    ];
    const personalPages = [['历史记录','i-history'],['收藏夹','i-bookmark'],['稍后再看','i-clock']];
    const homeFeed = Array.from({length:50}, (_, index) => videos[index % videos.length]);
    const records = {'历史记录':[], '收藏夹':[], '稍后再看':[]};
    const recordKey = 'video-redesign-records';
    try {
      const saved = JSON.parse(localStorage.getItem(recordKey));
      for (const name of Object.keys(records)) {
        if (Array.isArray(saved?.[name])) records[name] = saved[name].filter(id => videos.some(video => video.image === id));
      }
    } catch {}
    let page='首页',category='推荐',query='',currentVideo;
    const $=id=>document.getElementById(id);
    function icon(name){return `<svg aria-hidden="true"><use href="#${name}"/></svg>`}
    function renderNav() {
      for (const [id, entries] of [['primaryNav', pages], ['recordNav', personalPages]]) {
        $(id).innerHTML = entries.map(([name, ic]) => {
          const active = page === name;
          return `<button class="nav-item${active ? ' active' : ''}" data-page="${name}" aria-current="${active ? 'page' : 'false'}" title="${name}" aria-label="${name}">${icon(ic)}<span>${name}</span></button>`;
        }).join('');
      }
      document.querySelectorAll('[data-page]').forEach(button => {
        button.onclick = () => navigate(button.dataset.page);
      });
    }
    function navigate(nextPage) {
      page = nextPage;
      category = '推荐';
      query = '';
      $('searchInput').value = '';
      $('extraCategories').classList.remove('open');
      $('moreButton').setAttribute('aria-expanded', 'false');
      window.scrollTo(0, 0);
      updatePage();
    }
    function renderCategories(){ $('categoryList').innerHTML=categories.map(c=>`<button role="tab" aria-selected="${category===c}" class="category ${category===c?'active':''}" data-category="${c}">${c}</button>`).join('');$('extraCategories').innerHTML=extras.map(c=>`<button class="${category===c?'active':''}" data-category="${c}">${c}</button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;renderCategories();renderFeed()})}
    function getFiltered(){
      if (page in records) return records[page].map(id => videos.find(video => video.image === id));
      return homeFeed.filter(v=>(category==='推荐'||v.category===category)&&(!query||`${v.title} ${v.author} ${v.category}`.toLowerCase().includes(query)))}
    function renderFeed(){const items=getFiltered();$('videoGrid').innerHTML=items.length?items.map((v)=>`<article class="card"><button class="card-media" data-video="${v.image}" aria-label="查看${v.title}"><img src="Assets/cover-${String(v.image).padStart(2,'0')}.jpg" alt="${v.category}视频封面" loading="lazy"><span class="views">${icon('i-play')}${v.views}</span><span class="duration">${v.duration}</span></button><h4 class="card-title">${v.title}</h4><div class="card-meta"><span class="author-dot">${v.author[0]}</span><span>${v.author}</span><span class="separator">·</span><span class="date">${v.date}</span></div></article>`).join(''):`<div class="empty"><strong>${page in records ? '暂无' + page : '暂时没有找到相关视频'}</strong></div>`;document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>openVideo(videos.find(v=>v.image===Number(b.dataset.video))))}
    function bannerDistance() {
      return $('mastheadBanner').getBoundingClientRect().bottom - $('masthead').offsetHeight;
    }
    function syncMasthead() {
      $('masthead').classList.toggle('is-scrolled', page === '首页' && bannerDistance() <= 0);
    }
    function updatePage() {
      const isHome = page === '首页';
      renderNav();
      $('main').classList.toggle('secondary-page', !isHome);
      $('homeContent').hidden = !isHome && !(page in records);
      $('categoryBar').hidden = !isHome;
      if (isHome) renderCategories();
      if (!$('homeContent').hidden) renderFeed();
      syncMasthead();
    }
    function saveRecords() {
      try { localStorage.setItem(recordKey, JSON.stringify(records)); } catch {}
    }
    function updateRecordButtons() {
      $('favoriteButton').setAttribute('aria-pressed', String(records['收藏夹'].includes(currentVideo.image)));
      $('watchLaterButton').setAttribute('aria-pressed', String(records['稍后再看'].includes(currentVideo.image)));
    }
    function toggleRecord(name) {
      const id = currentVideo.image;
      const list = records[name];
      records[name] = list.includes(id) ? list.filter(item => item !== id) : [id, ...list];
      saveRecords();
      updateRecordButtons();
    }
    function openVideo(video) {
      currentVideo = video;
      records['历史记录'] = [video.image, ...records['历史记录'].filter(id => id !== video.image)];
      saveRecords();
      $('modalImage').src = `Assets/cover-${String(video.image).padStart(2,'0')}.jpg`;
      $('modalImage').alt = video.title;
      $('modalTitle').textContent = video.title;
      $('modalInfo').textContent = `${video.author} · ${video.category} · ${video.views}次观看 · ${video.duration}`;
      updateRecordButtons();
      $('videoModal').classList.add('open');
      $('closeModal').focus();
    }
    function closeVideo() {
      if (!$('videoModal').classList.contains('open')) return;
      $('videoModal').classList.remove('open');
      if (page in records) renderFeed();
    }
    $('brandLink').onclick = event => { event.preventDefault(); navigate('首页'); };
    $('favoriteButton').onclick = () => toggleRecord('收藏夹');
    $('watchLaterButton').onclick = () => toggleRecord('稍后再看');
    window.addEventListener('scroll', syncMasthead, {passive:true});
    window.addEventListener('resize', syncMasthead);
    $('collapseButton').onclick=()=>{const sidebar=$('sidebar');const mobile=window.matchMedia('(max-width:760px)').matches;const collapsed=mobile?sidebar.classList.toggle('expanded-mobile'):sidebar.classList.toggle('collapsed');if(!mobile)$('main').classList.toggle('sidebar-collapsed',collapsed);const isOpen=mobile?collapsed:!collapsed;$('collapseButton').setAttribute('aria-expanded',String(isOpen));$('collapseButton').setAttribute('aria-label',isOpen?'折叠一级导航':'展开一级导航');$('collapseButton').title=isOpen?'折叠一级导航':'展开一级导航'};
    $('moreButton').onclick=()=>{const open=$('extraCategories').classList.toggle('open');$('moreButton').setAttribute('aria-expanded',String(open))};
    $('searchInput').oninput=e=>{query=e.target.value.trim().toLowerCase();if(page!=='首页'){page='首页';updatePage()}else renderFeed()};
    $('closeModal').onclick=closeVideo;$('videoModal').onclick=e=>{if(e.target===$('videoModal'))closeVideo()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});
    $('notifyButton').onclick=()=>alert('暂时没有新消息');$('profileButton').onclick=()=>alert('个人中心即将开放');
    updatePage();
  </script>
</body>
</html>
