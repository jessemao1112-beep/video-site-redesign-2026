    <header class="masthead" id="masthead" aria-label="站点导航">
      <div class="masthead-inner">
        <label class="search"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="搜索你感兴趣的视频" aria-label="搜索视频" /></label>
        <div class="top-actions">
          <a class="icon-button" href="https://member.bilibili.com/platform/upload/video/frame" target="_blank" rel="noopener" aria-label="投稿（在新标签页打开）" title="投稿">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          </a>
          <a class="icon-button" href="https://account.bilibili.com/account/big" target="_blank" rel="noopener" aria-label="会员（在新标签页打开）" title="会员">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 5 4 4-7 4 7 5-4-2 12H5z"/></svg>
          </a>
          <a class="icon-button" href="https://member.bilibili.com/platform/home" target="_blank" rel="noopener" aria-label="创作中心（在新标签页打开）" title="创作中心">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 15v2m4-6v6m4-9v9"/></svg>
          </a>
          <button class="icon-button" id="notifyButton" aria-label="通知" title="通知"><svg><use href="#i-bell"/></svg></button>
          <button class="avatar" id="profileButton" aria-label="个人中心" title="个人中心">M</button>
        </div>
      </div>
    </header>
    <div class="content" id="homeContent">
      <div class="category-bar" id="categoryBar">
        <div class="category-list" id="categoryList" role="group" aria-label="视频分类"></div>
      </div>
      <div class="video-grid" id="videoGrid"></div>
    </div>
  </main>
  <div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-panel"><img class="modal-image" id="modalImage" alt=""><div class="modal-body"><h2 id="modalTitle"></h2><p id="modalInfo"></p><div class="record-actions">
    <button class="record-action" id="favoriteButton" type="button" aria-pressed="false">收藏</button>
    <button class="record-action" id="watchLaterButton" type="button" aria-pressed="false">稍后再看</button>
  </div><div class="modal-footer"><span>视频播放资源可在接入内容服务后启用</span><button class="close-modal" id="closeModal">关闭</button></div></div></div></div>
  <script src="Assets/home-feed.js"></script>
  <script>
    const pages=[['首页','i-home'],['动态','i-activity'],['追番','i-tv'],['影视','i-film'],['直播','i-live']];
    const categories=['推荐','生活','美食','游戏','音乐','知识','娱乐','鬼畜','旅行','科技','运动','时尚','萌宠','纪录片'];
    const sampleVideos=[
      {title:'下班后，给自己做一顿认真又简单的晚餐',author:'小林的日常',category:'美食',views:'24.8万',duration:'08:42',date:'2小时前',image:1},
      {title:'在游戏里建一座会发光的海边小镇',author:'像素研究所',category:'游戏',views:'18.6万',duration:'14:26',date:'5小时前',image:2},
      {title:'那些让人想把耳机音量调大的现场瞬间',author:'耳朵收藏家',category:'音乐',views:'36.2万',duration:'11:03',date:'昨天',image:3},
      {title:'读完这本书，我重新理解了时间的形状',author:'一页之间',category:'知识',views:'9.7万',duration:'16:18',date:'昨天',image:4},
      {title:'周末去看一场演出，顺便捡回一点快乐',author:'阿橘不加糖',category:'娱乐',views:'12.4万',duration:'06:51',date:'2天前',image:5},
      {title:'用一支短片记录二十岁最后一个夏天',author:'野生放映员',category:'生活',views:'42.1万',duration:'09:35',date:'3天前',image:6},
      {title:'离开城市的48小时：山野、日落和风',author:'慢慢去远方',category:'旅行',views:'17.9万',duration:'12:47',date:'3天前',image:7},
      {title:'把旧房间改造成理想的创作角落',author:'空间漫游',category:'生活',views:'8.3万',duration:'07:24',date:'4天前',image:8},
      {title:'一碗热气腾腾的面，是雨天最好的答案',author:'阿有的厨房',category:'美食',views:'33.6万',duration:'10:12',date:'4天前',image:9},
      {title:'这些小设备，悄悄改变了我的工作方式',author:'好奇心电台',category:'科技',views:'7.8万',duration:'13:02',date:'5天前',image:10},
      {title:'朋友相聚时那些完全没计划的快乐',author:'今天也晴朗',category:'鬼畜',views:'29.4万',duration:'05:19',date:'5天前',image:11},
      {title:'想念海的时候，就来看一会儿浪',author:'浪花放送',category:'纪录片',views:'15.1万',duration:'18:08',date:'6天前',image:12}
    ];
    const personalPages = [['历史记录','i-history'],['收藏夹','i-bookmark'],['稍后再看','i-clock']];
    const videos = [...homeFeed, ...sampleVideos];
    function shuffleRecommendations() {
      const shuffled = [...homeFeed];
      for (let index = shuffled.length - 1; index > 0; index--) {
        const other = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[other]] = [shuffled[other], shuffled[index]];
      }
      return shuffled;
    }
    let recommendations = shuffleRecommendations();
    window.addEventListener('pageshow', event => {
      if (!event.persisted) return;
      recommendations = shuffleRecommendations();
      if (page === '首页' && category === '推荐' && !query) renderFeed();
    });
    const coverFor = video => video.cover ?? `Assets/cover-${String(video.image).padStart(2,'0')}.jpg`;
    const escapeHTML = value => String(value).replace(/[&<>"\']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    const records = {'历史记录':[], '收藏夹':[], '稍后再看':[]};
    const recordKey = 'video-redesign-records';
    try {
      const saved = JSON.parse(localStorage.getItem(recordKey));
      for (const name of Object.keys(records)) {
        if (Array.isArray(saved?.[name])) records[name] = saved[name].filter(id => videos.some(video => video.image === id));
      }
    } catch {}
    let page='首页',category='推荐',query='',currentVideo;
    const $=id=>document.getElementById(id);
    function icon(name){return `<svg aria-hidden="true"><use href="#${name}"/></svg>`}
    function renderNav() {
      for (const [id, entries] of [['primaryNav', pages], ['recordNav', personalPages]]) {
        $(id).innerHTML = entries.map(([name, ic]) => {
          const active = page === name;
          return `<button class="nav-item${active ? ' active' : ''}" data-page="${name}" aria-current="${active ? 'page' : 'false'}" title="${name}" aria-label="${name}">${icon(ic)}<span>${name}</span></button>`;
        }).join('');
      }
      document.querySelectorAll('[data-page]').forEach(button => {
        button.onclick = () => { closeRecordPopover(); navigate(button.dataset.page); };
        if (button.closest('#recordNav')) {
          button.addEventListener('mouseenter', () => showRecordPopover(button));
          button.addEventListener('focus', () => showRecordPopover(button));
        }
      });
    }
    const recordPopover = $('recordPopover');
    const previewFolders = ['默认收藏夹', '周末灵感', '喜欢的音乐'];
    let previewFolder = 0;
    let historyTab = '视频';
    let popoverCloseTimer;
    function closeRecordPopover() { recordPopover.hidden = true; }
    function previewRows(name) {
      const selected = records[name].map(id => videos.find(video => video.image === id)).filter(Boolean);
      let examples;
      if (name === '历史记录') {
        examples = historyTab === '视频' ? sampleVideos.slice(0, 4) :
          historyTab === '直播' ? sampleVideos.slice(4, 8) : sampleVideos.slice(8, 12);
      } else if (name === '收藏夹') {
        examples = sampleVideos.slice(3 + previewFolder * 2, 7 + previewFolder * 2);
      } else {
        examples = [...sampleVideos.slice(4), ...homeFeed.slice(0, 6)];
      }
      const items = name === '历史记录' && historyTab !== '视频' ? examples :
        [...selected, ...examples.filter(video => !selected.some(saved => saved.image === video.image))];
      return items.slice(0, name === '稍后再看' ? 12 : 4).map(video => `
        <button class="record-popover-row" data-preview-video="${video.image}">
          <img src="${coverFor(video)}" alt="" loading="lazy">
          <span><strong>${escapeHTML(video.title)}</strong><small>${escapeHTML(video.author)} · ${escapeHTML(video.duration)}</small></span>
        </button>`).join('');
    }
    function renderRecordPopover(name) {
      let content = '';
      if (name === '历史记录') {
        content = `<div class="record-popover-head"><h2>历史记录</h2><button data-preview-page="历史记录">查看更多 ›</button></div>
          <div class="record-popover-folders"><aside>${['视频', '直播', '专栏'].map(tab => `<button data-preview-tab="${tab}" class="${tab === historyTab ? 'active' : ''}">${tab}</button>`).join('')}</aside><div class="record-popover-list">${previewRows(name)}</div></div>`;
      } else if (name === '收藏夹') {
        content = `<div class="record-popover-head"><h2>收藏夹</h2></div><div class="record-popover-folders"><aside>${previewFolders.map((folder, index) => `<button data-preview-folder="${index}" class="${index === previewFolder ? 'active' : ''}">${folder}</button>`).join('')}</aside><div class="record-popover-list">${previewRows(name)}</div></div>
          <div class="record-popover-footer"><button data-preview-page="收藏夹">查看全部收藏</button></div>`;
      } else {
        content = `<div class="record-popover-head"><h2>稍后再看</h2></div>
          <div class="record-popover-list">${previewRows(name)}</div>
          <div class="record-popover-footer"><button data-preview-page="稍后再看">查看全部</button></div>`;
      }
      recordPopover.innerHTML = content;
    }
    function showRecordPopover(button) {
      clearTimeout(popoverCloseTimer);
      const name = button.dataset.page;
      recordPopover.dataset.page = name;
      renderRecordPopover(name);
      const sidebarRight = $('sidebar').getBoundingClientRect().right;
      recordPopover.style.left = `${sidebarRight}px`;
      recordPopover.hidden = false;
      recordPopover.style.top = `${Math.max(12, Math.min(button.getBoundingClientRect().top - 18, innerHeight - recordPopover.offsetHeight - 12))}px`;
    }
    $('recordNav').addEventListener('mouseleave', () => {
      popoverCloseTimer = setTimeout(closeRecordPopover, 160);
    });
    recordPopover.addEventListener('mouseenter', () => clearTimeout(popoverCloseTimer));
    recordPopover.addEventListener('mouseleave', closeRecordPopover);
    recordPopover.addEventListener('click', event => {
      const videoButton = event.target.closest('[data-preview-video]');
      const pageButton = event.target.closest('[data-preview-page]');
      const folderButton = event.target.closest('[data-preview-folder]');
      const tabButton = event.target.closest('[data-preview-tab]');
      if (videoButton) { closeRecordPopover(); openVideo(videos.find(video => video.image === Number(videoButton.dataset.previewVideo))); }
      if (pageButton) { closeRecordPopover(); navigate(pageButton.dataset.previewPage); }
      if (folderButton) { previewFolder = Number(folderButton.dataset.previewFolder); renderRecordPopover('收藏夹'); }
      if (tabButton) { historyTab = tabButton.dataset.previewTab; renderRecordPopover('历史记录'); }
    });
    document.addEventListener('focusin', event => {
      if (!event.target.closest('#recordNav, #recordPopover')) closeRecordPopover();
    });
    function navigate(nextPage) {
      page = nextPage;
      category = '推荐';
      query = '';
      $('searchInput').value = '';
      window.scrollTo(0, 0);
      updatePage();
    }
    function renderCategories() {
      const list = $('categoryList');
      if (!list.childElementCount) {
        list.innerHTML = categories.map(name =>
          `<button type="button" class="category" data-category="${name}">${name}</button>`
        ).join('');
        list.onclick = event => {
          const button = event.target.closest('[data-category]');
          if (!button) return;
          category = button.dataset.category;
          renderCategories();
          renderFeed();
        };
      }
      for (const button of list.children) {
        const selected = button.dataset.category === category;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      }
    }
    function getFiltered(){
      if (page in records) return records[page].map(id => videos.find(video => video.image === id));
      const feed = category === '推荐' && !query ? recommendations : homeFeed;
      return feed.filter(v=>(category==='推荐'||v.category===category)&&(!query||`${v.title} ${v.author} ${v.category}`.toLowerCase().includes(query)))}
    function renderFeed(){const items=getFiltered();$('videoGrid').innerHTML=items.length?items.map((v)=>`<article class="card" style="--card-tint:hsl(${Math.round((v.image*137.508+18)%360)} 24% 92%)"><button class="card-media" data-video="${v.image}" aria-label="查看${escapeHTML(v.title)}"><img src="${coverFor(v)}" alt="${escapeHTML(v.category)}视频封面" loading="lazy"><span class="views">${icon('i-play')}${v.views}</span><span class="duration">${v.duration}</span></button><h4 class="card-title">${escapeHTML(v.title)}</h4><div class="card-meta"><span>${escapeHTML(v.author)}</span><span class="separator">·</span><span class="date">${v.date}</span></div></article>`).join(''):`<div class="empty"><strong>${page in records ? '暂无' + page : '暂时没有找到相关视频'}</strong></div>`;
      if (page === '首页' && items.length && !query) {
        const particleCount = 150;
        const confetti = Array.from({length: particleCount}, (_, index) => {
          const x = (index + .5) * 100 / particleCount;
          const duration = 2 + (index % 9) * .25;
          const delay = -((index * 13) % 19) * duration / 19;
          const size = 5 + index % 6;
          const drift = Math.round((Math.random() * 2 - 1) * 36);
          const angle = Math.floor(Math.random() * 360);
          const spin = (Math.random() < .5 ? -1 : 1) * (120 + Math.round(Math.random() * 240));
          return `<i style="--x:${x}%;--duration:${duration}s;--delay:${delay}s;--size:${size}px;--drift:${drift}px;--angle:${angle}deg;--spin:${spin}deg"></i>`;
        }).join('');
        $('videoGrid').insertAdjacentHTML('afterbegin', `
          <a class="feed-banner" href="watch.html" aria-label="观看 BLG 夺冠复盘">
            <img src="Assets/feed-banner.png" width="2560" height="240" alt="恭喜 BLG 获得 2026 英雄联盟全球总决赛冠军">
            <div class="banner-confetti" aria-hidden="true">${confetti}</div>
          </a>`);
      }
      $('videoGrid').querySelectorAll('.card').forEach(card => {
        const button = card.querySelector('[data-video]');
        card.onclick = () => openVideo(videos.find(video => video.image === Number(button.dataset.video)));
      });}
    function updatePage() {
      const isHome = page === '首页';
      renderNav();
      $('main').classList.toggle('secondary-page', !isHome);
      $('homeContent').hidden = !isHome && !(page in records);
      $('categoryBar').hidden = !isHome;
      if (isHome) renderCategories();
      if (!$('homeContent').hidden) renderFeed();
    }
    function saveRecords() {
      try { localStorage.setItem(recordKey, JSON.stringify(records)); } catch {}
    }
    function updateRecordButtons() {
      $('favoriteButton').setAttribute('aria-pressed', String(records['收藏夹'].includes(currentVideo.image)));
      $('watchLaterButton').setAttribute('aria-pressed', String(records['稍后再看'].includes(currentVideo.image)));
    }
    function toggleRecord(name) {
      const id = currentVideo.image;
      const list = records[name];
      records[name] = list.includes(id) ? list.filter(item => item !== id) : [id, ...list];
      saveRecords();
      updateRecordButtons();
    }
    function openVideo(video) {
      currentVideo = video;
      records['历史记录'] = [video.image, ...records['历史记录'].filter(id => id !== video.image)];
      saveRecords();
      const bvid = videoIdFromCover(video.cover);
      if (bvid) {
        location.href = 'watch.html?v=' + bvid;
        return;
      }
      $('modalImage').src = coverFor(video);
      $('modalImage').alt = video.title;
      $('modalTitle').textContent = video.title;
      $('modalInfo').textContent = `${video.author} · ${video.category} · ${video.views}次观看 · ${video.duration}`;
      updateRecordButtons();
      $('videoModal').classList.add('open');
      $('closeModal').focus();
    }
    function closeVideo() {
      if (!$('videoModal').classList.contains('open')) return;
      $('videoModal').classList.remove('open');
      if (page in records) renderFeed();
    }
    $('brandLink').onclick = event => { event.preventDefault(); navigate('首页'); };
    $('favoriteButton').onclick = () => toggleRecord('收藏夹');
    $('watchLaterButton').onclick = () => toggleRecord('稍后再看');
    function syncSidebarToViewport(){
      const gridStyles=getComputedStyle($('videoGrid'));
      const contentStyles=getComputedStyle($('homeContent'));
      const expandedSidebarWidth=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar'));
      const expandedFeedWidth=window.innerWidth-expandedSidebarWidth-parseFloat(contentStyles.paddingLeft)-parseFloat(contentStyles.paddingRight);
      const threeColumnFloor=3*parseFloat(gridStyles.getPropertyValue('--min-card-width'))+2*parseFloat(gridStyles.columnGap);
      const compact=window.innerWidth<=760||expandedFeedWidth<=threeColumnFloor+1.5;
      $('sidebar').classList.toggle('collapsed',compact);
      $('main').classList.toggle('sidebar-collapsed',compact);
    }
    window.addEventListener('resize',syncSidebarToViewport);
    syncSidebarToViewport();
    $('searchInput').oninput=e=>{query=e.target.value.trim().toLowerCase();if(page!=='首页'){page='首页';updatePage()}else renderFeed()};
    $('closeModal').onclick=closeVideo;$('videoModal').onclick=e=>{if(e.target===$('videoModal'))closeVideo()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});
    $('notifyButton').onclick=()=>alert('暂时没有新消息');$('profileButton').onclick=()=>alert('个人中心即将开放');
    const initialSearch = new URLSearchParams(location.search).get('q');
    if (initialSearch) {
      $('searchInput').value = initialSearch;
      query = initialSearch.trim().toLowerCase();
    }
    updatePage();
  </script>
</body>
</html>
