    let historyTab = '视频';
    let popoverCloseTimer;
    function closeRecordPopover() { recordPopover.hidden = true; }
    function previewRows(name) {
      const selected = records[name].map(id => videos.find(video => video.image === id)).filter(Boolean);
      let examples;
      if (name === '历史记录') {
        examples = historyTab === '视频' ? sampleVideos.slice(0, 4) :
          historyTab === '直播' ? sampleVideos.slice(4, 8) : sampleVideos.slice(8, 12);
      } else if (name === '收藏夹') {
        examples = sampleVideos.slice(3 + previewFolder * 2, 7 + previewFolder * 2);
      } else {
        examples = [...sampleVideos.slice(4), ...homeFeed.slice(0, 6)];
      }
      const items = name === '历史记录' && historyTab !== '视频' ? examples :
        [...selected, ...examples.filter(video => !selected.some(saved => saved.image === video.image))];
      return items.slice(0, name === '稍后再看' ? 12 : 4).map(video => `
        <button class="record-popover-row" data-preview-video="${video.image}">
          <img src="${coverFor(video)}" alt="" loading="lazy">
          <span><strong>${escapeHTML(video.title)}</strong><small>${escapeHTML(video.author)} · ${escapeHTML(video.duration)}</small></span>
        </button>`).join('');
    }
    function renderRecordPopover(name) {
      let content = '';
      if (name === '历史记录') {
        content = `<div class="record-popover-head"><h2>历史记录</h2><button data-preview-page="历史记录">查看更多 ›</button></div>
          <div class="record-popover-folders"><aside>${['视频', '直播', '专栏'].map(tab => `<button data-preview-tab="${tab}" class="${tab === historyTab ? 'active' : ''}">${tab}</button>`).join('')}</aside><div class="record-popover-list">${previewRows(name)}</div></div>`;
      } else if (name === '收藏夹') {
        content = `<div class="record-popover-head"><h2>收藏夹</h2></div><div class="record-popover-folders"><aside>${previewFolders.map((folder, index) => `<button data-preview-folder="${index}" class="${index === previewFolder ? 'active' : ''}">${folder}</button>`).join('')}</aside><div class="record-popover-list">${previewRows(name)}</div></div>
          <div class="record-popover-footer"><button data-preview-page="收藏夹">查看全部收藏</button></div>`;
      } else {
        content = `<div class="record-popover-head"><h2>稍后再看</h2></div>
          <div class="record-popover-list">${previewRows(name)}</div>
          <div class="record-popover-footer"><button data-preview-page="稍后再看">查看全部</button></div>`;
      }
      recordPopover.innerHTML = content;
    }
    function showRecordPopover(button) {
      clearTimeout(popoverCloseTimer);
      const name = button.dataset.page;
      recordPopover.dataset.page = name;
      renderRecordPopover(name);
      const sidebarRight = $('sidebar').getBoundingClientRect().right;
      recordPopover.style.left = `${sidebarRight}px`;
      recordPopover.hidden = false;
      recordPopover.style.top = `${Math.max(12, Math.min(button.getBoundingClientRect().top - 18, innerHeight - recordPopover.offsetHeight - 12))}px`;
    }
    $('recordNav').addEventListener('mouseleave', () => {
      popoverCloseTimer = setTimeout(closeRecordPopover, 160);
    });
    recordPopover.addEventListener('mouseenter', () => clearTimeout(popoverCloseTimer));
    recordPopover.addEventListener('mouseleave', closeRecordPopover);
    recordPopover.addEventListener('click', event => {
      const videoButton = event.target.closest('[data-preview-video]');
      const pageButton = event.target.closest('[data-preview-page]');
      const folderButton = event.target.closest('[data-preview-folder]');
      const tabButton = event.target.closest('[data-preview-tab]');
      if (videoButton) { closeRecordPopover(); openVideo(videos.find(video => video.image === Number(videoButton.dataset.previewVideo))); }
      if (pageButton) { closeRecordPopover(); navigate(pageButton.dataset.previewPage); }
      if (folderButton) { previewFolder = Number(folderButton.dataset.previewFolder); renderRecordPopover('收藏夹'); }
      if (tabButton) { historyTab = tabButton.dataset.previewTab; renderRecordPopover('历史记录'); }
    });
    document.addEventListener('focusin', event => {
      if (!event.target.closest('#recordNav, #recordPopover')) closeRecordPopover();
    });
    function navigate(nextPage) {
      page = nextPage;
      category = '推荐';
      query = '';
      $('searchInput').value = '';
      window.scrollTo(0, 0);
      updatePage();
    }
    function renderCategories() {
      const list = $('categoryList');
      if (!list.childElementCount) {
        list.innerHTML = categories.map(name =>
          `<button type="button" class="category" data-category="${name}">${name}</button>`
        ).join('');
        list.onclick = event => {
          const button = event.target.closest('[data-category]');
          if (!button) return;
          category = button.dataset.category;
          renderCategories();
          renderFeed();
        };
      }
      for (const button of list.children) {
        const selected = button.dataset.category === category;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      }
    }
    function getFiltered(){
      if (page in records) return records[page].map(id => videos.find(video => video.image === id));
      return homeFeed.filter(v=>(category==='推荐'||v.category===category)&&(!query||`${v.title} ${v.author} ${v.category}`.toLowerCase().includes(query)))}
    function renderFeed(){const items=getFiltered();$('videoGrid').innerHTML=items.length?items.map((v)=>`<article class="card" style="--card-tint:hsl(${Math.round((v.image*137.508+18)%360)} 24% 92%)"><button class="card-media" data-video="${v.image}" aria-label="查看${escapeHTML(v.title)}"><img src="${coverFor(v)}" alt="${escapeHTML(v.category)}视频封面" loading="lazy"><span class="views">${icon('i-play')}${v.views}</span><span class="duration">${v.duration}</span></button><h4 class="card-title">${escapeHTML(v.title)}</h4><div class="card-meta"><span>${escapeHTML(v.author)}</span><span class="separator">·</span><span class="date">${v.date}</span></div></article>`).join(''):`<div class="empty"><strong>${page in records ? '暂无' + page : '暂时没有找到相关视频'}</strong></div>`;document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>openVideo(videos.find(v=>v.image===Number(b.dataset.video))))}
    function updatePage() {
      const isHome = page === '首页';
      renderNav();
      $('main').classList.toggle('secondary-page', !isHome);
      $('homeContent').hidden = !isHome && !(page in records);
      $('categoryBar').hidden = !isHome;
      if (isHome) renderCategories();
      if (!$('homeContent').hidden) renderFeed();
    }
    function saveRecords() {
      try { localStorage.setItem(recordKey, JSON.stringify(records)); } catch {}
    }
    function updateRecordButtons() {
      $('favoriteButton').setAttribute('aria-pressed', String(records['收藏夹'].includes(currentVideo.image)));
      $('watchLaterButton').setAttribute('aria-pressed', String(records['稍后再看'].includes(currentVideo.image)));
    }
    function toggleRecord(name) {
      const id = currentVideo.image;
      const list = records[name];
      records[name] = list.includes(id) ? list.filter(item => item !== id) : [id, ...list];
      saveRecords();
      updateRecordButtons();
    }
    function openVideo(video) {
      currentVideo = video;
      records['历史记录'] = [video.image, ...records['历史记录'].filter(id => id !== video.image)];
      saveRecords();
      $('modalImage').src = coverFor(video);
      $('modalImage').alt = video.title;
      $('modalTitle').textContent = video.title;
      $('modalInfo').textContent = `${video.author} · ${video.category} · ${video.views}次观看 · ${video.duration}`;
      updateRecordButtons();
      $('videoModal').classList.add('open');
      $('closeModal').focus();
    }
    function closeVideo() {
      if (!$('videoModal').classList.contains('open')) return;
      $('videoModal').classList.remove('open');
      if (page in records) renderFeed();
    }
    $('brandLink').onclick = event => { event.preventDefault(); navigate('首页'); };
    $('favoriteButton').onclick = () => toggleRecord('收藏夹');
    $('watchLaterButton').onclick = () => toggleRecord('稍后再看');
    function syncSidebarToViewport(){
      const gridStyles=getComputedStyle($('videoGrid'));
      const contentStyles=getComputedStyle($('homeContent'));
      const expandedSidebarWidth=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar'));
      const expandedFeedWidth=window.innerWidth-expandedSidebarWidth-parseFloat(contentStyles.paddingLeft)-parseFloat(contentStyles.paddingRight);
      const threeColumnFloor=3*parseFloat(gridStyles.getPropertyValue('--min-card-width'))+2*parseFloat(gridStyles.columnGap);
      const compact=window.innerWidth<=760||expandedFeedWidth<=threeColumnFloor+1.5;
      $('sidebar').classList.toggle('collapsed',compact);
      $('main').classList.toggle('sidebar-collapsed',compact);
    }
    window.addEventListener('resize',syncSidebarToViewport);
    syncSidebarToViewport();
    $('searchInput').oninput=e=>{query=e.target.value.trim().toLowerCase();if(page!=='首页'){page='首页';updatePage()}else renderFeed()};
    $('closeModal').onclick=closeVideo;$('videoModal').onclick=e=>{if(e.target===$('videoModal'))closeVideo()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});
    $('notifyButton').onclick=()=>alert('暂时没有新消息');$('profileButton').onclick=()=>alert('个人中心即将开放');
    updatePage();
  </script>
</body>
</html>
