    function renderFeed(){const items=getFiltered();const rotated=items.length?items.slice(offset%items.length).concat(items.slice(0,offset%items.length)):[];$('feedHeading').innerHTML=page==='首页'?(category==='推荐'?'为你<span>推荐</span>':`${category}<span>精选</span>`):`${page}<span>精选</span>`;$('feedCount').textContent=`共 ${items.length} 条内容`;$('videoGrid').innerHTML=rotated.length?rotated.map((v)=>`<article class="card"><button class="card-media" data-video="${v.image}" aria-label="查看${v.title}"><img src="Assets/cover-${String(v.image).padStart(2,'0')}.jpg" alt="${v.category}视频封面" loading="lazy"><span class="views">${icon('i-play')}${v.views}</span><span class="duration">${v.duration}</span></button><h4 class="card-title">${v.title}</h4><div class="card-meta"><span class="author-dot">${v.author[0]}</span><span>${v.author}</span><span class="separator">·</span><span class="date">${v.date}</span></div></article>`).join(''):'<div class="empty"><strong>暂时没有找到相关视频</strong>换个关键词或频道试试。</div>';document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>openVideo(videos.find(v=>v.image===Number(b.dataset.video))))}
    function updatePage(){renderNav();renderCategories();$('topbarTitle').textContent=page;$('sectionTitle').textContent=page==='首页'?'发现频道':`${page}频道`;const hero={首页:['把热爱，<br>看成生活','从平凡日常出发，去遇见不平凡的世界。'],动态:['新鲜故事，<br>正在发生','看看大家此刻都在分享什么。'],追番:['下一集的心动，<br>正在等你','和喜欢的故事，继续相遇。'],影视:['光影之间，<br>总有回响','从一帧画面开始，走进另一种人生。'],直播:['这一刻，<br>一起在场','打开实时的热爱，加入正在发生的故事。']}[page];$('heroTitle').innerHTML=hero[0];$('heroDesc').textContent=hero[1];renderFeed()}
    function openVideo(v){$('modalImage').src=`Assets/cover-${String(v.image).padStart(2,'0')}.jpg`;$('modalImage').alt=v.title;$('modalTitle').textContent=v.title;$('modalInfo').textContent=`${v.author} · ${v.category} · ${v.views}次观看 · ${v.duration}`;$('videoModal').classList.add('open');$('closeModal').focus()}
    function closeVideo(){$('videoModal').classList.remove('open')}
    $('collapseButton').onclick=()=>{const collapsed=$('sidebar').classList.toggle('collapsed');$('main').classList.toggle('expanded',collapsed);$('collapseButton').setAttribute('aria-expanded',String(!collapsed));$('collapseButton').setAttribute('aria-label',collapsed?'展开一级导航':'折叠一级导航');$('collapseButton').title=collapsed?'展开一级导航':'折叠一级导航'};
    $('moreButton').onclick=()=>{const open=$('extraCategories').classList.toggle('open');$('moreButton').setAttribute('aria-expanded',String(open))};
    $('searchInput').oninput=e=>{query=e.target.value.trim().toLowerCase();offset=0;renderFeed()};
    $('refreshButton').onclick=()=>{offset++;renderFeed()};
    $('heroButton').onclick=()=>document.querySelector('.section-top').scrollIntoView({behavior:'smooth'});
    $('closeModal').onclick=closeVideo;$('videoModal').onclick=e=>{if(e.target===$('videoModal'))closeVideo()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});
    $('notifyButton').onclick=()=>alert('暂时没有新消息');$('profileButton').onclick=()=>alert('个人中心即将开放');
    updatePage();
  </script>
</body>
</html>
